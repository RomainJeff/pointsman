<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Pointsman — README header</title>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600&display=block" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1280px; height: 400px; background: transparent; }
  /* Same palette as the app icon and the intro video */
  .card { position: relative; width: 1280px; height: 400px; border-radius: 28px; overflow: hidden;
    background: radial-gradient(ellipse 70% 120% at 18% 40%, #22345C 0%, #0D1526 70%);
    display: flex; align-items: center; gap: 64px; padding: 0 96px 24px; font-family: 'Outfit', sans-serif; color: #F3EBDD; }
  .track { position: absolute; left: 0; right: 0; bottom: 30px; height: 34px;
    background: repeating-linear-gradient(90deg, #3A4E78 0 11px, transparent 11px 36px); opacity: 0.6; }
  .track::before, .track::after { content: ""; position: absolute; left: 0; right: 0; height: 4px; background: rgba(243,235,221,0.25); }
  .track::before { top: 7px; } .track::after { bottom: 7px; }
  .icon { width: 260px; height: 260px; flex: none; filter: drop-shadow(0 22px 36px rgba(0,0,0,0.45)); }
  h1 { font-size: 112px; font-weight: 600; letter-spacing: -0.025em; line-height: 1; }
  p { margin-top: 20px; font-size: 38px; color: rgba(243,235,221,0.72); }
</style>
</head>
<body>
  <div class="card">
    <img class="icon" src="../Resources/AppIcon.svg" alt="">
    <div>
      <h1>Pointsman</h1>
      <p>Every link goes to the browser it belongs in.</p>
    </div>
    <div class="track"></div>
  </div>
</body>
</html>
