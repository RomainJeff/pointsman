<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Pointsman — logo</title>
<style>
  body { font-family: var(--font-sans, -apple-system, system-ui, sans-serif); color: var(--foreground, #eee); }
  .wrap { display: flex; flex-direction: column; gap: 28px; padding: 8px 0 16px; }
  .hero { display: flex; align-items: center; gap: 32px; flex-wrap: wrap; }
  .hero svg { width: 220px; height: 220px; filter: drop-shadow(0 18px 30px rgba(0,0,0,.35)); }
  .word { display: flex; flex-direction: column; gap: 6px; }
  .word h1 { margin: 0; font-size: 44px; letter-spacing: -0.02em; font-weight: 700; }
  .word p { margin: 0; color: var(--muted-foreground, #999); font-size: 15px; max-width: 30ch; line-height: 1.4; }
  .row { display: flex; align-items: flex-end; gap: 22px; flex-wrap: wrap; }
  .cell { display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 12px; color: var(--muted-foreground, #999); font-family: var(--font-mono, ui-monospace, monospace); }
  .bar { display: flex; align-items: center; gap: 14px; padding: 6px 14px; border-radius: var(--radius, 8px); background: var(--card, #222); border: 1px solid var(--border, #333); }
  .bar svg { color: var(--foreground, #eee); }
  .bar span { font-size: 13px; color: var(--muted-foreground, #999); }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22345C"/>
      <stop offset="1" stop-color="#0D1526"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".14"/>
      <stop offset=".5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#F5B43C" stop-opacity=".55"/>
      <stop offset="1" stop-color="#F5B43C" stop-opacity="0"/>
    </radialGradient>
    <!-- Tracks: one stem from the bottom, splitting at the points into two branches -->
    <path id="stem" d="M512 870 V610"/>
    <path id="left" d="M512 610 C512 480 352 470 352 330 V170"/>
    <path id="right" d="M512 610 C512 480 672 470 672 330 V170"/>

    <symbol id="icon" viewBox="0 0 1024 1024">
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#bg)"/>
      <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
      <clipPath id="clip"><rect x="100" y="100" width="824" height="824" rx="185"/></clipPath>
      <g clip-path="url(#clip)" fill="none" stroke-linecap="butt">
        <!-- sleepers -->
        <g stroke="#3A4E78" stroke-width="96" stroke-dasharray="16 44">
          <use href="#stem"/><use href="#left"/><use href="#right"/>
        </g>
        <!-- idle branch -->
        <use href="#left" stroke="#F3EBDD" stroke-opacity=".32" stroke-width="40" stroke-linecap="round"/>
        <!-- chosen route -->
        <use href="#stem" stroke="#F5B43C" stroke-width="40"/>
        <use href="#right" stroke="#F5B43C" stroke-width="40" stroke-linecap="round"/>
        <!-- the link travelling up the chosen branch -->
        <circle cx="672" cy="250" r="120" fill="url(#glow)"/>
        <circle cx="672" cy="250" r="46" fill="#F3EBDD"/>
        <!-- the points lever -->
        <circle cx="512" cy="640" r="34" fill="#0D1526" stroke="#F5B43C" stroke-width="16"/>
      </g>
    </symbol>

    <!-- Menu bar template: monochrome, no background, drawn with currentColor -->
    <symbol id="glyph" viewBox="0 0 1024 1024">
      <g fill="none" stroke="currentColor" stroke-width="96">
        <path d="M512 960 V610"/>
        <path d="M512 610 C512 470 300 460 300 300 V90" stroke-opacity=".4" stroke-linecap="round"/>
        <path d="M512 610 C512 470 724 460 724 300 V200" stroke-linecap="round"/>
      </g>
      <circle cx="724" cy="130" r="110" fill="currentColor"/>
    </symbol>
  </defs>
</svg>

<div class="wrap">
  <div class="hero">
    <svg viewBox="0 0 1024 1024"><use href="#icon"/></svg>
    <div class="word">
      <h1>Pointsman</h1>
      <p>L'aiguilleur de tes liens : chaque clic part sur la bonne voie.</p>
    </div>
  </div>

  <div class="row">
    <div class="cell"><svg width="128" height="128" viewBox="0 0 1024 1024"><use href="#icon"/></svg>128</div>
    <div class="cell"><svg width="64" height="64" viewBox="0 0 1024 1024"><use href="#icon"/></svg>64</div>
    <div class="cell"><svg width="32" height="32" viewBox="0 0 1024 1024"><use href="#icon"/></svg>32</div>
    <div class="cell"><svg width="16" height="16" viewBox="0 0 1024 1024"><use href="#icon"/></svg>16</div>
    <div class="cell">
      <div class="bar">
        <svg width="16" height="16" viewBox="0 0 1024 1024"><use href="#glyph"/></svg>
        <span>barre de menu</span>
      </div>
      template
    </div>
  </div>
</div>
</body>
</html>
